<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animation Test</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070707;color:#fff;font-family:Arial,sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:18px}.wrap{width:min(900px,96vw);text-align:center}.stage{height:min(60vh,480px);min-height:280px;border:1px solid #333;background:#111;display:grid;place-items:center;overflow:hidden;position:relative;border-radius:12px}.demo{font-size:clamp(32px,9vw,100px);font-weight:900;letter-spacing:.04em}.controls{display:flex;gap:10px;justify-content:center;align-items:center;margin:14px 0}.controls button,.play{background:#222;color:#fff;border:1px solid #555;border-radius:9px;padding:11px 20px;cursor:pointer;font:inherit}.controls button:hover,.play:hover{background:#2c2c2c}.num{min-width:110px;font-weight:700}.play{width:min(420px,100%);font-weight:700}.desc{opacity:.65}.a1{animation:a1 .8s steps(8) infinite}.a2{animation:a2 1.4s ease-in-out infinite}.a3{animation:a3 .65s steps(2) infinite}@keyframes a1{0%{transform:translate(-120px,80px) rotate(-8deg);filter:none}25%{transform:translate(100px,-70px) skewX(25deg);filter:blur(2px)}50%{transform:translate(-50px,-10px) scale(1.4);filter:contrast(3)}75%{transform:translate(130px,70px) skewX(-30deg);filter:blur(1px)}100%{transform:translate(0) rotate(0)}}@keyframes a2{0%,100%{transform:scale(.2) rotate(-20deg);opacity:0}30%{transform:scale(1.3) rotate(8deg);opacity:1}55%{transform:translate(-80px,20px) scale(.9);opacity:.7}80%{transform:translate(70px,-30px) scale(1.1);opacity:1}}@keyframes a3{0%{transform:translateX(-500px);filter:contrast(5)}20%{transform:translateX(180px) skewX(40deg)}40%{transform:translateX(-80px) scaleX(1.8)}60%{transform:translateX(300px) scaleX(.5)}80%{transform:translateX(-40px) scale(1.5);filter:invert(.2)}100%{transform:translateX(0);filter:none}}</style></head><body><main class="wrap"><h1>Startup Animations</h1><div class="stage"><div id="demo" class="demo a1">IKIRUMI</div></div><div class="controls"><button id="prev">←</button><div id="num" class="num">Animation 1</div><button id="next">→</button></div><p id="desc" class="desc">Chaotic VHS jump and distortion</p><button id="play" class="play">Play Animation 1</button></main><script>let n=1;const demo=document.getElementById('demo'),num=document.getElementById('num'),desc=document.getElementById('desc'),play=document.getElementById('play');const descs=['Chaotic VHS jump and distortion','Rapid zoom, rotation and signal instability','Aggressive tracking glitch and displacement'];function show(){demo.className='demo a'+n;num.textContent='Animation '+n;desc.textContent=descs[n-1];play.textContent='Play Animation '+n}document.getElementById('next').onclick=()=>{n=n%3+1;show()};document.getElementById('prev').onclick=()=>{n=n===1?3:n-1;show()};play.onclick=()=>{demo.style.animation='none';void demo.offsetWidth;demo.style.animation='';demo.className='demo a'+n};show();</script></body></html>
