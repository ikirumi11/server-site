<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Startup Animation Test</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}.wrap{width:min(900px,94vw);text-align:center}.stage{height:min(55vh,420px);min-height:260px;border:1px solid #333;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.demo{font-size:clamp(30px,8vw,90px);font-weight:900}.controls{display:flex;gap:10px;justify-content:center;align-items:center;margin:14px}.controls button{background:#222;color:#fff;border:1px solid #555;border-radius:8px;padding:10px 20px;cursor:pointer}.num{min-width:110px}.play{background:#fff!important;color:#111!important}.a1{animation:a1 .8s steps(8) infinite}.a2{animation:a2 1.4s ease-in-out infinite}.a3{animation:a3 .65s steps(2) infinite}@keyframes a1{0%{transform:translate(-120px,80px) rotate(-8deg);filter:none}25%{transform:translate(100px,-70px) skewX(25deg);filter:blur(2px)}50%{transform:translate(-50px,-10px) scale(1.4);filter:contrast(3)}75%{transform:translate(130px,70px) skewX(-30deg);filter:blur(1px)}100%{transform:translate(0) rotate(0)}}@keyframes a2{0%,100%{transform:scale(.2) rotate(-20deg);opacity:0}30%{transform:scale(1.3) rotate(8deg);opacity:1}55%{transform:translate(-80px,20px) scale(.9);opacity:.7}80%{transform:translate(70px,-30px) scale(1.1);opacity:1}}@keyframes a3{0%{transform:translateX(-500px);filter:contrast(5)}20%{transform:translateX(180px) skewX(40deg)}40%{transform:translateX(-80px) scaleX(1.8)}60%{transform:translateX(300px) scaleX(.5)}80%{transform:translateX(-40px) scale(1.5);filter:invert(.2)}100%{transform:translateX(0);filter:none}}</style></head><body><main class="wrap"><h2>Chat Startup Animation Test</h2><div class="stage"><div id="demo" class="demo a1">GAME CHAT</div></div><div class="controls"><button id="prev">←</button><div class="num" id="num">Animation 1</div><button id="next">→</button></div><button class="play" id="play">Play Animation 1</button><p id="desc">Test only — this page is for choosing the startup animation for Chat App 2.</p></main><script>let n=1;const d=document.getElementById('demo'),num=document.getElementById('num'),desc=document.getElementById('desc'),play=document.getElementById('play');const ds=['Chaotic VHS jumps, tearing and distortion','Rapid zoom, rotation and unstable signal movement','Aggressive VHS tracking and displacement'];function show(){d.className='demo a'+n;num.textContent='Animation '+n;play.textContent='Play Animation '+n;desc.textContent=ds[n-1]}function next(){n=n%3+1;show()}function prev(){n=n===1?3:n-1;show()}function replay(){d.classList.remove('a'+n);void d.offsetWidth;d.classList.add('a'+n)}document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;play.onclick=replay;</script></body></html>
